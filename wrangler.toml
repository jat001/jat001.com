name = "jat001"
compatibility_date = "2026-09-20"

# Three paths need code: `/` negotiates on Accept, and `/404` + `/404.html`
# have to answer 404 rather than 200. Everything else is pure edge assets.
main = "worker/index.js"

[assets]
directory = "./dist"
not_found_handling = "404-page"
binding = "ASSETS"
run_worker_first = ["/", "/index.html", "/404", "/404.html"]

[cache]
enabled = true

[observability.logs]
enabled = true

[observability.traces]
enabled = true

name: GitHub Pages

on:
  push:
    branches: [main]
    # Cloudflare's half of the repo. Ignored rather than allow-listed: a new
    # build input that nobody remembered to add would leave this site stale
    # without saying so, where a new Cloudflare file only costs a spare run.
    paths-ignore:
      - worker/**
      - wrangler.toml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

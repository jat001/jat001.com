name: GitHub Pages

on:
  push:
    branches: [main]
    # Nothing here reaches the Astro build. Ignored rather than allow-listed:
    # a build input nobody remembered to add would leave this site stale with
    # nothing to show for it, where a file missing from this list costs one
    # spare run. `*.md` is the root docs only — GitHub's `*` does not cross a
    # `/`, so Markdown under src/ would still trigger. `.gitattributes` is
    # absent on purpose: it decides the line endings of the checkout, and so
    # can change the bytes that are built.
    paths-ignore:
      - worker/**
      - wrangler.jsonc
      - vercel.json
      - .vscode/**
      - .gitignore
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6
        with:
          node-version: 24

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
